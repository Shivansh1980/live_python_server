<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>{% block title %}Admin{% endblock %} · BuildMind Labs</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    {% block shell %}
    <header class="topbar">
        <a class="brand" href="/admin" aria-label="BuildMind Labs admin home">
            <span class="brand-mark">B</span>
            <span>
                <strong>BuildMind Labs</strong>
                <small>Operations console</small>
            </span>
        </a>
        <nav class="admin-nav" aria-label="Admin sections">
            <a href="/admin" {% if request.url.path == "/admin" %}aria-current="page"{% endif %}>Enquiries</a>
            <a href="/admin/analytics" {% if request.url.path.startswith("/admin/analytics") %}aria-current="page"{% endif %}>Analytics</a>
            <a href="/admin/payload-configs" {% if request.url.path.startswith("/admin/payload-configs") %}aria-current="page"{% endif %}>Payload configs</a>
        </nav>
        <div class="topbar-actions">
            <span class="secure-pill"><span></span> Secure session</span>
            <form method="post" action="/admin/logout">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button class="button button-ghost" type="submit">Sign out</button>
            </form>
        </div>
    </header>
    <main class="shell">
        {% if flash %}
        <div class="flash flash-{{ flash.category }}" role="status">
            {{ flash.message }}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    {% endblock %}
    <script src="/static/admin.js" defer></script>
</body>
</html>
